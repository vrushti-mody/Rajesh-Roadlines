# Local development or a single-server deployment.
#   docker compose up -d db            # just the database, then `npm run dev`
#   docker compose --profile full up -d --build   # database + app
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rrpl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrpl_dev_only}
      POSTGRES_DB: rrpl
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrpl"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://rrpl:${POSTGRES_PASSWORD:-rrpl_dev_only}@db:5432/rrpl
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["full"]
volumes:
  pgdata:
