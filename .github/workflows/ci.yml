name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: rrpl, POSTGRES_PASSWORD: rrpl, POSTGRES_DB: rrpl }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rrpl" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://rrpl:rrpl@localhost:5432/rrpl
      PAYLOAD_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: platform/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run generate:types
      - run: npm run typecheck
      - run: npm run build
